name: Verify
on:
  push:
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c "
          import glob, json, sys

          errors = []
          required_fields = ['name', 'description', 'prompt', 'resources']

          for agent_file in glob.glob('agents/*.json'):
              try:
                  with open(agent_file) as f:
                      data = json.load(f)
              except json.JSONDecodeError as e:
                  errors.append(f'{agent_file}: invalid JSON ({e})')
                  continue

              for field in required_fields:
                  if field not in data:
                      errors.append(f'{agent_file}: missing required field \"{field}\"')

              prompt = data.get('prompt', '')
              if prompt and not prompt.startswith('file://'):
                  errors.append(f'{agent_file}: prompt must start with file:// (got \"{prompt}\")')

              for r in data.get('resources', []):
                  if not r.startswith('file://') and not r.startswith('skill://'):
                      errors.append(f'{agent_file}: resource must start with file:// or skill:// (got \"{r}\")')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('Agent JSON schema valid')
          "
      - run: |
          python3 -c "
          import glob, os, re, sys

          errors = []
          pattern = re.compile(r'^---\nname: (.+)\ndescription: (.+)\n---$', re.MULTILINE)
          names_seen = {}

          for skill in glob.glob('skills/**/SKILL.md', recursive=True):
              with open(skill) as f:
                  content = f.read()
              match = pattern.search(content)
              if not match:
                  errors.append(f'{skill}: missing or malformed header (expected ---/name/description/---)')
                  continue

              name = match.group(1)
              description = match.group(2)

              if len(description.strip()) < 10:
                  errors.append(f'{skill}: description too short ({len(description.strip())} chars)')

              skill_dir = os.path.basename(os.path.dirname(skill))
              if name != skill_dir:
                  errors.append(f'{skill}: name \"{name}\" does not match directory \"{skill_dir}\"')

              if name in names_seen:
                  errors.append(f'{skill}: duplicate name \"{name}\" (also in {names_seen[name]})')
              names_seen[name] = skill

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All skill headers valid')
          "
      - run: |
          python3 -c "
          import glob, json, os, re, sys

          def strip_prefix(path):
              prefixes = ['file://', 'skill://']
              for p in prefixes:
                  if path.startswith(p):
                      path = path[len(p):]
              if path.startswith('.kiro/'):
                  path = path[len('.kiro/'):]
              return path

          errors = []

          for agent_file in glob.glob('agents/*.json'):
              with open(agent_file) as f:
                  data = json.load(f)

              prompt = strip_prefix(data.get('prompt', ''))
              if prompt and not os.path.exists(prompt):
                  errors.append(f'Missing prompt file: {prompt} (referenced by {agent_file})')

              for r in data.get('resources', []):
                  pattern = strip_prefix(r)
                  if not glob.glob(pattern, recursive=True):
                      errors.append(f'No files match resource: {r} (in {agent_file})')

          skill_dirs = set(os.listdir('skills')) if os.path.isdir('skills') else set()

          for root, _, files in os.walk('prompts'):
              for f in files:
                  if not f.endswith('.md'):
                      continue
                  path = os.path.join(root, f)
                  content = open(path).read()
                  refs = re.findall(r'\x60(\S+?)\x60 skill', content)
                  for ref in refs:
                      if ref not in skill_dirs:
                          errors.append(f'{path}: references missing skill \"{ref}\"')

          prompt_pattern = re.compile(r'\x60(\S+?\.md)\x60')
          steering_files = set(os.listdir('steering')) if os.path.isdir('steering') else set()
          prompt_files = set()
          for root, _, files in os.walk('prompts'):
              for f in files:
                  prompt_files.add(f)

          for root, _, files in os.walk('prompts'):
              for f in files:
                  if not f.endswith('.md'):
                      continue
                  path = os.path.join(root, f)
                  content = open(path).read()
                  refs = prompt_pattern.findall(content)
                  for ref in refs:
                      if ref in prompt_files or ref in steering_files:
                          continue
                      if os.path.exists(os.path.join('prompts', ref)):
                          continue
                      if os.path.exists(os.path.join('steering', ref)):
                          continue
                      for search_root, _, search_files in os.walk('prompts'):
                          if ref in search_files:
                              break
                      else:
                          if ref not in steering_files:
                              errors.append(f'{path}: references \"{ref}\" which does not exist in prompts/ or steering/')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('Forward references valid')
          "
      - run: |
          python3 -c "
          import glob, json, os, re, sys

          def strip_prefix(path):
              prefixes = ['file://', 'skill://']
              for p in prefixes:
                  if path.startswith(p):
                      path = path[len(p):]
              if path.startswith('.kiro/'):
                  path = path[len('.kiro/'):]
              return path

          errors = []
          referenced_files = set()
          referenced_skills = set()

          for agent_file in glob.glob('agents/*.json'):
              with open(agent_file) as f:
                  data = json.load(f)
              for r in data.get('resources', []):
                  pattern = strip_prefix(r)
                  referenced_files.update(glob.glob(pattern, recursive=True))
              prompt = strip_prefix(data.get('prompt', ''))
              if prompt:
                  referenced_files.add(prompt)

          for root, _, files in os.walk('prompts'):
              for f in files:
                  if not f.endswith('.md'):
                      continue
                  path = os.path.join(root, f)
                  content = open(path).read()
                  refs = re.findall(r'\x60(\S+?)\x60 skill', content)
                  referenced_skills.update(refs)

          for md in glob.glob('prompts/**/*.md', recursive=True):
              if md not in referenced_files:
                  errors.append(f'Unreferenced prompt file: {md}')

          for skill_md in glob.glob('skills/**/SKILL.md', recursive=True):
              if skill_md not in referenced_files:
                  errors.append(f'Unreferenced skill file: {skill_md}')

          skill_dirs = set(os.listdir('skills')) if os.path.isdir('skills') else set()
          for skill in skill_dirs:
              if skill not in referenced_skills:
                  errors.append(f'Skill \"{skill}\" is never referenced in any prompt')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('Reverse references valid')
          "
